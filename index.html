<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sam Gift Card Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vazirmatn Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .card-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .animate-pulse-subtle { animation: pulse-subtle 2s infinite; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen pb-20">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">S</div>
            <h1 class="text-lg font-bold tracking-tight">Sam Gift Card</h1>
        </div>
        <a href="https://t.me/samgiftcardstorebot" class="text-sm bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full border border-blue-600/30">
            💬 پشتیبانی
        </a>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-md mx-auto space-y-6">
        
        <!-- Categories -->
        <section>
            <h2 class="text-sm font-medium text-slate-400 mb-3 mr-1">دسته‌بندی‌ها</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="filterCategory('apple')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-white/10 transition-all active:scale-95">
                    <span class="text-2xl">🍎</span>
                    <span class="text-sm">Apple / iTunes</span>
                </button>
                <button onclick="filterCategory('playstation')" class="glass p-4 rounded-2xl flex flex-col items-center gap-2 hover:bg-white/10 transition-all active:scale-95">
                    <span class="text-2xl">🎮</span>
                    <span class="text-sm">PlayStation</span>
                </button>
            </div>
        </section>

        <!-- Product Grid -->
        <section id="product-grid" class="grid grid-cols-1 gap-4">
            <!-- Products will be injected here by JS -->
        </section>
    </main>

    <!-- Payment Modal (Hidden by default) -->
    <div id="payment-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="glass w-full max-w-sm rounded-3xl p-6 relative z-10 overflow-hidden">
            <h3 id="modal-title" class="text-xl font-bold mb-4 text-center">پرداخت سفارش</h3>
            
            <div class="space-y-4">
                <div class="bg-white/5 p-4 rounded-2xl text-center">
                    <p class="text-slate-400 text-xs mb-1">مبلغ قابل پرداخت</p>
                    <p id="modal-price" class="text-2xl font-bold text-blue-400">--</p>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-2 mr-1">۴ رقم آخر کارت بانکی</label>
                    <input type="password" id="cardSuffix" maxlength="4" placeholder="مثلاً 1234" 
                        class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-center text-lg tracking-widest focus:outline-none focus:border-blue-500 transition-all">
                    <p id="error-msg" class="text-red-400 text-[10px] mt-1 hidden text-center">لطفاً ۴ رقم صحیح وارد کنید</p>
                </div>

                <div class="text-[11px] text-slate-500 text-center leading-relaxed">
                    شماره کارت: <span class="text-slate-300">6219-8619-0997-1334</span><br>
                    نام صاحب حساب: <span class="text-slate-300">Ali Sabzkar Kashani</span> (Blu Bank)
                </div>

                <button onclick="confirmOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-lg shadow-blue-600/20">
                    تأیید و ثبت سفارش
                </button>
            </div>
        </div>
    </div>

    <!-- Success State (Hidden by default) -->
    <div id="success-modal" class="fixed inset-0 z-[110] flex items-center justify-center p-4 hidden">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md"></div>
        <div class="glass w-full max-w-sm rounded-3xl p-8 text-center relative z-10">
            <div class="w-20 h-20 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">✓</div>
            <h3 class="text-2xl font-bold mb-2">سفارش ثبت شد!</h3>
            <p class="text-slate-400 text-sm mb-8">لطفاً پس از انجام انتقال، رسید خود را در تلگرام برای ما ارسال کنید.</p>
            <button onclick="location.reload()" class="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-4 rounded-2xl transition-all">
                بازگشت به فروشگاه
            </button>
        </div>
    </div>

    <script>
        // --- DATA ---
        const products = [
            { id: 1, category: 'apple', name: 'iTunes $5', price: '350,000', icon: '🍎' },
            { id: 2, category: 'apple', name: 'iTunes $10', price: '680,000', icon: '🍎' },
            { id: 3, category: 'playstation', name: 'PSN $10', price: '720,000', icon: '🎮' },
            { id: 4, category: 'playstation', name: 'PSN $20', price: '1,400,000', icon: '🎮' },
        ];

        let selectedProduct = null;

        // --- DOM ELEMENTS ---
        const productGrid = document.getElementById('product-grid');
        const paymentModal = document.getElementById('payment-modal');
        const successModal = document.getElementById('success-modal');
        const cardSuffixInput = document.getElementById('cardSuffix');
        const errorMsg = document.getElementById('error-msg');

        // --- FUNCTIONS ---

        function renderProducts(filter = 'all') {
            productGrid.innerHTML = '';
            const filtered = filter === 'all' ? products : products.filter(p => p.category === filter);
            
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'glass p-4 rounded-3xl flex items-center justify-between hover:bg-white/5 transition-all active:scale-[0.98] cursor-pointer';
                div.onclick = () => openPayment(p);
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="text-3xl">${p.icon}</div>
                        <div>
                            <h3 class="font-bold text-slate-100">${p.name}</h3>
                            <p class="text-xs text-slate-400">ارسال آنی</p>
                        </div>
                    </div>
                    <div class="text-left">
                        <p class="text-blue-400 font-bold">${p.price}</p>
                        <p class="text-[10px] text-slate-500">تومان</p>
                    </div>
                `;
                productGrid.appendChild(div);
            });
        }

        function filterCategory(cat) {
            renderProducts(cat);
        }

        function openPayment(product) {
            selectedProduct = product;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price + ' تومان';
            paymentModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            paymentModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            cardSuffixInput.value = '';
            errorMsg.classList.add('hidden');
        }

        function confirmOrder() {
            const suffix = cardSuffixInput.value;
            
            if (suffix.length !== 4 || isNaN(suffix)) {
                errorMsg.classList.remove('hidden');
                cardSuffixInput.classList.add('border-red-500');
                return;
            }

            // 1. Generate tracking code
            const trackingCode = `GC-${Math.floor(1000 + Math.random() * 9000)}`;

            // 2. Prepare Notification Text (The magic part)
            const orderMessage = `🔔 سفارش جدید!\n\n` +
                                `📦 محصول: ${selectedProduct.name}\n` +
                                `💰 مبلغ: ${selectedProduct.price} تومان\n` +
                                `💳 کارت: ****${suffix}\n` +
                                `🆔 کد پیگیری: ${trackingCode}`;

            // 3. Open Telegram with the message
            const botUsername = 'samgiftcardstorebot';
            const telegramUrl = `https://t.me/${botUsername}?text=${encodeURIComponent(orderMessage)}`;
            
            // We open it in a new tab/app, then show success on the current site
            window.open(telegramUrl, '_blank');

            // 4. Show Success state on the website
            paymentModal.classList.add('hidden');
            successModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Initialize
        renderProducts();
    </script>
</body>
</html>
