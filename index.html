<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه گیفت کارت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --text-color: var(--tg-theme-text-color, #222);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; margin: 0 0 6px 0; }
        .header p { font-size: 13px; color: var(--hint-color); margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .card-icon { font-size: 36px; margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        .card-price { font-size: 13px; color: var(--button-color); font-weight: bold; margin-bottom: 12px; }
        .buy-btn { background-color: var(--button-color); color: var(--button-text); border: none; border-radius: 8px; padding: 8px; font-size: 13px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>فروشگاه گیفت کارت اپل</h1>
        <p>تحویل آنی و مطمئن</p>
    </div>
    <div class="grid">
        <div class="card">
            <div class="card-icon">🍎</div>
            <div class="card-title">گیفت کارت ۵ دلاری</div>
            <div class="card-price">۳۵۰,۰۰۰ تومان</div>
            <button class="buy-btn" onclick="alert('خرید ۵ دلاری')">خرید</button>
        </div>
        <div class="card">
            <div class="card-icon">🍎</div>
            <div class="card-title">گیفت کارت ۱۰ دلاری</div>
            <div class="card-price">۶۹۰,۰۰۰ تومان</div>
            <button class="buy-btn" onclick="alert('خرید ۱۰ دلاری')">خرید</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
    </script>
</body>
</html>
